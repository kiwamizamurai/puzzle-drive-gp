<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PUZZLE DRIVE GP</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel@v2.9.9/wasm/pyxel.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000000;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Hide Pyxel's own branded loading logo; keep the "click to start"
         prompt, which is required to unlock audio playback in the browser. */
      img#pyxel-logo {
        display: none !important;
      }
      /* Pyxel sizes the canvas box (100% on desktop, 80%-tall with virtual
         gamepad controls on touch) but doesn't preserve the game's own
         220x176 aspect ratio within it. object-fit letterboxes the drawn
         frame instead of stretching it. */
      canvas#canvas {
        object-fit: contain;
        object-position: center;
      }
      html, body, #pyxel-screen {
        touch-action: none;
      }
      #portrait-hint {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 4px;
        text-align: center;
        color: #a3a3a3;
        font: 12px monospace;
        pointer-events: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #portrait-hint {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <pyxel-run root="." name="src/main.py" gamepad="enabled"></pyxel-run>
    <div id="portrait-hint">rotate for a bigger view</div>
  </body>
</html>
